<svg viewBox="0 0 840 415" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Peacock's Reviews">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1f33"/>
      <stop offset="100%" stop-color="#15172a"/>
    </linearGradient>
    <style>
      .head { font: 700 26px Georgia, serif; fill: #ffd166; }
      .meta { font: 13px 'Courier New', monospace; fill: #8b93b8; }
      .body { font: 17px Georgia, serif; fill: #dde2f1; }
      .moral { font: italic 17px Georgia, serif; fill: #f4a261; }
      .ln { opacity: 0; animation: rise 0.9s ease forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .rule { stroke: #ffd166; stroke-width: 1; opacity: 0.5; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.5s ease 0.4s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="840" height="415" rx="14" fill="url(#parchment)" stroke="#2e3354" stroke-width="1.5"/>
  <text class="head" x="70" y="52">✦ The Peacock's Reviews</text>
  <line class="rule" x1="70" y1="66" x2="770" y2="66"/>
  <text style="animation-delay:0.80s" class="body ln" x="70" y="96">A Peacock spread his tail before the forest animals, demanding they rate</text>
  <text style="animation-delay:0.98s" class="body ln" x="70" y="123">his beauty. The Crow gave five stars, the Deer gave five, but a small</text>
  <text style="animation-delay:1.16s" class="body ln" x="70" y="150">Sparrow offered only three. Furious, the Peacock chased her away and</text>
  <text style="animation-delay:1.34s" class="body ln" x="70" y="177">boasted louder. Soon a Hawk, drawn by the noise, circled overhead. The</text>
  <text style="animation-delay:1.52s" class="body ln" x="70" y="204">other birds hid in silence, but the Peacock, addicted to attention, kept</text>
  <text style="animation-delay:1.70s" class="body ln" x="70" y="231">displaying. The Hawk descended. Too late, he wished the Sparrow's honest</text>
  <text style="animation-delay:1.88s" class="body ln" x="70" y="258">three had taught him quiet.</text>
  <text style="animation-delay:2.06s" class="moral ln" x="70" y="299">Moral: Those who crave only applause never hear the warning in</text>
  <text style="animation-delay:2.24s" class="moral ln" x="70" y="325">silence.</text>
  <text class="meta" x="70" y="387">a the Panchatantra tradition fable · told fresh on 23 Aug 2026 · today's voice: Opus 4.8 (depth)</text>
</svg>
